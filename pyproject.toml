[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger"
version = "1.3.0"
description = "Lightweight governance layer for LLM applications - zero database required"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "TokenLedger Team", email = "team@tokenledger.dev"}
]
keywords = ["llm", "tokens", "cost-tracking", "budget", "openai", "anthropic", "ai-governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
google = ["google-generativeai>=0.3.0"]
groq = ["groq>=0.4.0"]
ollama = ["ollama>=0.1.0"]
tiktoken = ["tiktoken>=0.5.0"]
opentelemetry = ["opentelemetry-api>=1.20.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "tiktoken>=0.5.0",
    "opentelemetry-api>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]
ci = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "openai>=1.0.0",
]

[project.scripts]
tokenledger = "tokenledger.__main__:main"

[tool.setuptools.packages.find]
include = ["tokenledger", "tokenledger.*"]

[project.urls]
Homepage = "https://github.com/Rohithdgrr/tokenLedger-module"
Repository = "https://github.com/Rohithdgrr/tokenLedger-module.git"
Issues = "https://github.com/Rohithdgrr/tokenLedger-module/issues"

[tool.ruff]
line-length = 140
target-version = "py39"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B905", "SIM108", "SIM117"]
[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "examples/", "docs/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["tokenledger"]
omit = ["*/tests/*", "*/ext/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests"]
